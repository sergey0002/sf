name: kernel-ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: doc/tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r doc/tools/requirements.txt

      - name: Index, reproducibility, paths and tests
        run: bash doc/tests/run.sh --ci

      - name: Build release artifact
        run: python -m pip wheel --no-build-isolation --no-deps -w dist .

      - name: Install artifact outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/arch-venv"
          "$RUNNER_TEMP/arch-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/arch-venv/bin/python" -m pip install dist/*.whl

      - name: Verify installed CLI and runtime resources
        run: |
          cd "$RUNNER_TEMP"
          reported=$("$RUNNER_TEMP/arch-venv/bin/arch" --version)
          metadata=$("$RUNNER_TEMP/arch-venv/bin/python" -c "import importlib.metadata as m; print(m.version('arch-cli'))")
          test "$reported" = "arch $metadata"
          "$RUNNER_TEMP/arch-venv/bin/arch" --root "$GITHUB_WORKSPACE" list --id ARCH-contract --json >/dev/null
