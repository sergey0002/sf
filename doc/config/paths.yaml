# Конфигурация путей и настроек проекта для arch CLI.
# Хранится в корне doc/ и читается CLI при каждой операции с документацией.
# Только пути, задекларированные ниже, считаются допустимыми в doc/.
# Любой файл вне этого перечня — мусор, подлежит диагностике и удалению только по решению пользователя.

version: "1.0"
doc_root: "doc"

# ---------------------------------------------------------------------------
# Настраиваемые корни проекта (relative to repository root).
# Эти корни определяют, где находятся основные компоненты проекта.
# Можно переопределить через --config для перенесённой или локальной раскладки.
# ---------------------------------------------------------------------------
roots:
  # Корень архитектурной документации
  architecture: "doc/architecture"
  # Корень задач
  tasks: "doc/tasks"
  # Корень схем
  schemas: "doc/architecture/schemas"
  # Корень конфигурации типов задач
  task_conf: "doc/config/task-conf"
  # Корень навыков
  skills: "doc/skills"
  # Корень справочного контекста (data/)
  reference: "data"
  # Путь к индексу (relative to architecture root)
  index: "index.json"
  # Корень конфигурации проекта (paths.yaml location)
  config: "doc/config"

# ---------------------------------------------------------------------------
# Допустимые пути (relative to repository root). Каждый путь — точный файл или
# шаблон с подстановкой (marked with {id}). Шаблоны покрывают повторяющиеся
# сущности (tasks, domains, entities, flows, capabilities, decisions).
# Пути строятся на основе корней из секции roots.
# ---------------------------------------------------------------------------
allowed_paths:

  # Корень doc
  - "{doc_root}/AGENTS.md"

  # Архитектурная документация (использует architecture root)
  - "{architecture}/README.md"
  - "{architecture}/glossary.md"
  - "{architecture}/{index}"

  # Системные документы (уровень system)
  - "{architecture}/system/manifest.md"
  - "{architecture}/system/architecture-contract.md"
  - "{architecture}/system/architecture-audit.md"
  - "{architecture}/system/cli-command-map.md"
  - "{architecture}/system/addressable-contracts.md"
  - "{architecture}/system/cli-package.md"
  - "{architecture}/system/cli-validation-rules.md"
  - "{architecture}/system/components.md"
  - "{architecture}/system/constraints-risks.md"
  - "{architecture}/system/context.md"
  - "{architecture}/system/data.md"
  - "{architecture}/system/overview.md"
  - "{architecture}/system/quality.md"
  - "{architecture}/system/security.md"
  - "{architecture}/system/task-number-registry.md"
  - "{architecture}/system/implementation-spec.md"
  - "{architecture}/system/testing.md"
  - "{architecture}/system/examples.md"
  - "{architecture}/system/runbook.md"

  # Схемы архитектуры (использует schemas root)
  - "{schemas}/document.schema.json"
  - "{schemas}/index.schema.json"
  - "{schemas}/flow.schema.json"
  - "{schemas}/flow-selection.schema.json"
  - "{schemas}/task-conf.schema.json"
  - "{schemas}/bodies/capability-spec.json"
  - "{schemas}/bodies/capability.json"
  - "{schemas}/bodies/component-view.json"
  - "{schemas}/bodies/constraints-risks.json"
  - "{schemas}/bodies/data-view.json"
  - "{schemas}/bodies/decision.json"
  - "{schemas}/bodies/domain.json"
  - "{schemas}/bodies/entity.json"
  - "{schemas}/bodies/flow.json"
  - "{schemas}/bodies/glossary.json"
  - "{schemas}/bodies/quality-attributes.json"
  - "{schemas}/bodies/rule-set.json"
  - "{schemas}/bodies/security-view.json"
  - "{schemas}/bodies/system-context.json"
  - "{schemas}/bodies/system.json"

  # Решения (ADR) — шаблон для любого ADR
  - "{architecture}/decisions/{id}.md"

  # Домены — шаблоны
  - "{architecture}/domains/{domain}/README.md"
  - "{architecture}/domains/{domain}/capability.md"
  - "{architecture}/domains/{domain}/flow.md"
  - "{architecture}/domains/{domain}/capabilities/{slug}.md"
  - "{architecture}/domains/{domain}/flows/{slug}.md"
  - "{architecture}/domains/{domain}/entities/{slug}.md"
  - "{architecture}/domains/task-lifecycle/cli-task-lifecycle.md"
  - "{architecture}/domains/task-lifecycle/cli-subtask-lifecycle.md"

  # Конфигурация проекта (использует config root)
  - "{config}/paths.yaml"
  - "{config}/agent-policy.yaml"
  - "{config}/task-registry.json"
  # Конфиги типов задач (иерархическая структура, использует task_conf root)
  - "{task_conf}/plan-defaults.yaml"
  - "{task_conf}/types/{type}/plan/{tier}.md"
  - "{task_conf}/types/{type}/config.yaml"
  - "{task_conf}/types/{type}/prompt.md"
  - "{task_conf}/types/{type}/flow-selection.yaml"
  - "{task_conf}/types/{type}/flows/{flow}/config.yaml"
  - "{task_conf}/types/{type}/flows/{flow}/prompt.md"
  - "{task_conf}/types/{type}/flows/{flow}/stepsprompt/{slug}.md"

  # Навыки агентов (использует skills root)
  - "{skills}/README.md"
  - "{skills}/{skill_id}/SKILL.md"
  - "{skills}/{skill_id}/references/{slug}.md"

  # Задачи — шаблон: {tasks}/{task_key}/...
  - "{tasks}/{task_key}/task.json"
  - "{tasks}/{task_key}/state.json"
  - "{tasks}/{task_key}/events.jsonl"
  - "{tasks}/{task_key}/.arch-write-journal.json"
  - "{tasks}/{task_key}/stage{stage}/plan.md"
  - "{tasks}/{task_key}/stage{stage}/verification.json"
  - "{tasks}/{task_key}/stage{stage}/baseline.json"
  - "{tasks}/{task_key}/baseline-{slug}.json"
  - "{tasks}/{task_key}/subtasks/{subtask_id}/task.json"
  - "{tasks}/{task_key}/subtasks/{subtask_id}/state.json"
  - "{tasks}/{task_key}/subtasks/{subtask_id}/events.jsonl"
  - "{tasks}/{task_key}/subtasks/{subtask_id}/stage{stage}/plan.md"
  - "{tasks}/{task_key}/subtasks/{subtask_id}/stage{stage}/verification.json"
  - "{tasks}/{task_key}/subtasks/{subtask_id}/stage{stage}/baseline.json"
  # Исследования задачи — свободные md-документы, привязанные к таску
  - "{tasks}/{task_key}/research/{slug}.md"

  # Тесты документации
  - "doc/tests/README.md"
  - "doc/tests/SCENARIOS.md"
  - "doc/tests/run.sh"
  - "doc/tests/test_task_identity.py"
  - "doc/tests/test_doc_contracts.py"
  - "doc/tests/test_doc_type_registry.py"
  - "doc/tests/test_plan_policy.py"
  - "doc/tests/test_task_fields.py"
  # Baseline замеры (тестовые артефакты)
  - "doc/tests/baseline/{slug}.json"

  # Инструменты (CLI)
  - "doc/tools/README.md"
  - "doc/tools/requirements.txt"
  - "doc/tools/arch/__init__.py"
  - "doc/tools/arch/plan_policy.py"
  - "doc/tools/arch/__main__.py"
  # CLI modular package (replaced monolithic cli.py)
  - "doc/tools/arch/cli/__init__.py"
  - "doc/tools/arch/cli/app.py"
  - "doc/tools/arch/cli/errors.py"
  - "doc/tools/arch/cli/output.py"
  - "doc/tools/arch/cli/commands/__init__.py"
  - "doc/tools/arch/cli/commands/base.py"
  - "doc/tools/arch/cli/commands/registry.py"
  - "doc/tools/arch/cli/commands/task_key.py"
  - "doc/tools/arch/cli/commands/builtin.py"
  - "doc/tools/arch/cli/commands/task.py"
  - "doc/tools/arch/cli/commands/session.py"
  - "doc/tools/arch/constants.py"
  - "doc/tools/arch/identity.py"
  - "doc/tools/arch/schema.py"
  - "doc/tools/arch/store.py"
  - "doc/tools/arch/sections.py"
  - "doc/tools/arch/doc_ops.py"
  - "doc/tools/arch/subtask.py"
  - "doc/tools/arch/validation.py"
  - "doc/tools/arch/body_validation.py"
  - "doc/tools/arch/project_config.py"
  - "doc/tools/arch/acceptance.py"
  - "doc/tools/arch/evidence.py"
  - "doc/tools/arch/flows.py"
  - "doc/tools/arch/fs_atomic.py"
  - "doc/tools/arch/task_ops.py"
  - "doc/tools/arch/task_record.py"
  - "doc/tools/arch/task_registry.py"
  - "doc/tools/arch/session_audit.py"
  - "doc/tools/tests/test_arch.py"
  - "doc/tools/tests/test_session_audit.py"
  - "doc/tools/tests/test_sections.py"

# ---------------------------------------------------------------------------
# Прочая конфигурация проекта, читаемая CLI
# ---------------------------------------------------------------------------
project:
  # Регистр и форматы идентификаторов
  id_formats:
    task_key: "^(?:[0-9]{4}|UI-[0-9]{4}|[A-Z][A-Z0-9]{0,7}-[0-9]{4})$"
    document_id: "^[A-Za-z][A-Za-z0-9._:-]*$"
    subtask_id: "^[0-9]{4}$"

  # Допустимые типы документов архитектуры.
  # Единственный источник истины: реестр ARCH-contract §5.5 и frontmatter
  # документов сверяются с этим списком тестом doc/tests/test_doc_type_registry.py.
  document_types:
    # Система и точки зрения
    - system
    - system-overview
    - system-context
    - component-view
    - architecture-view
    - data-view
    # Домен и знания
    - domain
    - capability
    - capability-spec
    - entity
    - glossary
    - rule-set
    # Поведение и интеграции
    - flow
    - integration
    - cross-cutting-concept
    # Качество, безопасность, ограничения
    - quality-attributes
    - quality-view
    - security-view
    - deployment-operations-view
    - constraints-risks
    # Решения и проверка
    - decision
    - verification-map
    - testing-spec
    - implementation-spec
    # Служебное
    - runbook
    - examples

  # Допустимые статусы документа. Статус решения (decision_status) задаётся отдельно.
  document_statuses:
    - draft
    - current
    - accepted
    - deprecated
    - superseded

  # Допустимые task_type (синхронизированы с doc/config/task-conf/types/*/config.yaml)
  task_types:
    - jira-incoming
    - research
    - planning
    - audit
    - feature
    - bugfix
    - docs
    - refactor
    - scaffold
    - subtask
    - spike
    - migration
    - incident

  # Допустимые phase
  phases:
    - intake
    - planning
    - execution
    - verification
    - completed
    - blocked

  # Допустимые статусы исполнения задачи (отдельная ось от phase).
  # phase — жизненный цикл карточки, status — исполнительное состояние.
  task_statuses:
    - open
    - in_progress
    - paused
    - blocked
    - review
    - done
    - cancelled
    - rejected

  # Допустимые уровни риска
  risk_levels:
    - low
    - medium
    - high
    - critical

  # Допустимые типы источников задач
  source_types:
    - jira
    - ui
    - other

  # Базовые обязательные поля task.json (для всех типов задач).
  # Специфичные поля для конкретного типа берутся из task-conf/types/<type>/config.yaml (required_fields).
  task_schema_required_fields:
    - schema_version
    - task_key
    - task_number
    - source
    - title
    - kind
    - intent
    - scope
    - acceptance_criteria
    - project_context_refs
    - constraints
    - assumptions
    - open_questions
    - risk
    - authority
    - approvals
    - task_type
    - flow
    - complexity
    - subtasks
    - depends_on
    - phase
    - rollback_plan
    - related_docs
    - related_tests
    - research_docs
    - changed_files
    - owner
    - priority
    - stage_history
    - target_release

  # CLI настройки
  cli:
    allowed_commands:
      - list
      - show
      - index build
      - index check
      - validate
      - docs paths --check
      - docs paths --resolved
      - docs tree
      - task-key
      - task init
      - task new
      - task registry
      - task registry init
      - task registry add
      - task registry check
      - task registry sync
      - task validate
      - task workspace
      - task status
      - task types
      - task flows --type <type>
      - task select-flow --type <type>
      - task flow-steps
      - task flow-prompt
      - task evidence
      - task decompose <task_key>
      - task diagnose <task_key>
      - task advance <task_key>
      - task close <task_key>
      - task migrate <task_key>
      - task event <task_key>
      - task replay <task_key>
      - task subtask init
      - task subtask validate
      - task subtask status
      - session find
      - session digest
      - session events
    strict_mode: true
    garbage_detector: true

  # Конфиг релизов и веток задач.
  # target_release — целевой релиз задачи (задаётся владельцем, не "unset").
  # branch — рабочая ветка самой задачи ( patterns: futures/{task_number} для Jira, bugfix/{task_key} для UI).
  # release_branch — ветка, в которую задача мержится (по умолчанию main, или release-ветка из конфига).
  release:
    default_branch: "main"
    default_release: "0.1.0"
    # enforce: true включает обязательность target_release/branch/release_branch.
    # Контракт Git-операций принадлежит UI-0027; поля карточки обязательны здесь.
    enforce: true
    branch_patterns:
      jira: "futures/{task_number}"
      ui: "bugfix/{task_key}"
      other: "task/{task_key}"
    release_branch_pattern: "release/{version}"

# ---------------------------------------------------------------------------
# Правила регламента структуры
# ---------------------------------------------------------------------------
structure_rules:
  # В doc/ сохраняются только файлы из allowed_paths. Любой другой файл — отклонение.
  only_declared_paths: true
  # Прозрачные расширения для архитектурных документов
  architecture_doc_extensions:
    - ".md"
    - ".json"
  # Фронтмatter обязателен для всех .md в doc/architecture/
  frontmatter_required_for:
    - "{architecture}/**/*.md"
  # Индекс генерируется, не правится вручную
  generated_files:
    - "{architecture}/{index}"
