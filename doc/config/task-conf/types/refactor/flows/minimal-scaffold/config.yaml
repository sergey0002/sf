id: minimal-scaffold
title: Минимальный каркас
type: refactor
description: |
  Минимальный flujo для простого рефакторинга без полной декомпозиции.
subtask_policy: optional
close_policy: all_subtasks_required
steps:
  - id: scaffold
    name: Каркас
    action: create_task_scaffold
    output: task.json, stage1/
    gate: scaffold_created
  - id: refactor
    name: Рефакторинг
    action: apply_refactor
    output: changed files
    gate: refactor_applied
  - id: close
    name: Закрытие
    action: close_task
    output: approvals, stage_history
    gate: all_subtasks_closed
