id: standard-implementation
title: Стандартная реализация
type: refactor
description: |
  Стандартный flujo рефакторинга: анализ → план → рефакторинг → тесты → верификация → закрытие.
subtask_policy: optional
close_policy: all_subtasks_required
steps:
  - id: architecture-context
    name: Сбор архитектурного контекста
    action: read_applicable_project_rules
    output: stageN/plan.md с источниками, инвариантами и связью с приёмкой
    gate: relevant_rules_traced_and_conflicts_resolved_for_targeted_work
  - id: analyze
    name: Анализ
    action: analyze_current_behavior
    output: evidence of current behavior
    gate: behavior_documented
  - id: plan
    name: Планирование
    action: create_plan
    output: stageN/plan.md
    gate: plan_ready_and_required_approval_recorded
  - id: refactor
    name: Рефакторинг
    action: apply_refactor
    output: changed files + tests
    gate: refactor_ready_for_verification
  - id: review-implementation
    name: Ревью реализации
    action: review_diff_against_acceptance_on_stable_snapshot
    output: результат ревью и ссылки на доказательства в stageN/plan.md
    gate: blocking_review_findings_resolved
  - id: architecture-sync
    name: Синхронизация архитектурной документации
    action: record_verified_architecture_delta
    output: обновлены канонические записи или в плане указана причина отсутствия дельты
    gate: architecture_delta_matches_verified_behavior_or_no_delta_recorded
  - id: verify
    name: Верификация
    action: run_tests
    output: stageN/verification.json
    gate: tests_passed_and_behavior_unchanged
  - id: close
    name: Закрытие
    action: close_task
    output: approvals, stage_history
    gate: acceptance_subtasks_and_owner_approval_recorded
