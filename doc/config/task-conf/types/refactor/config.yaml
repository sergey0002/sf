id: refactor
title: Рефакторинг
description: |
  Улучшение внутренней структуры без изменения внешнего поведения. Требует
  тестов и доказательства эквивалентности.
complexity_default: medium
complexity_allowed:
  - low
  - medium
  - high
allowed_flows:
  - standard-implementation
  - minimal-scaffold
default_flow: standard-implementation
subtask_policy: optional
close_policy: all_subtasks_required
required_fields:
  - rollback_plan
  - acceptance_criteria
  - contracts_and_invariants
forbidden_in_scope:
  - "изменение observable behavior без отдельного одобрения"

selectable: true
plan:
  plan_policy: replace
  tiers:
    micro:
      complexity: [low]
      max_nonempty_lines: 60
      required_sections: [Изменение, Эквивалентность]
      template: plan/micro.md
    standard:
      complexity: [low, medium]
      required_sections: [Цель, Правила, Решения, Инварианты поведения, Порядок, Дифференциальная проверка, Оценка, Риски]
      template: plan/standard.md
    full:
      complexity: [low, medium, high]
      required_sections: [Задача и связи, Цель, Правила, Решения, Инварианты поведения, Контракты данных, Границы прерывания, Дифференциальная проверка, Оценка, Риски]
      template: plan/full.md
  acceptance:
    profile: preservation
    rules:
    - {kind: case_min, min: 2}
    - {kind: section_present, section: 'Инварианты поведения'}
