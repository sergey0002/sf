id: planning
title: Планирование
description: |
  Составление технического плана, спецификации, архитектурных решений.
complexity_default: medium
complexity_allowed:
  - low
  - medium
  - high
allowed_flows:
  - research-first
  - standard-implementation
default_flow: research-first
subtask_policy: optional
close_policy: all_subtasks_required
required_fields:
  - acceptance_criteria
  - rollback_plan
forbidden_in_scope:
  - "реализация кода в рамках этой задачи"

selectable: true
plan:
  plan_policy: replace
  tiers:
    micro:
      complexity: [low]
      max_nonempty_lines: 60
      required_sections: [План, Варианты]
      template: plan/micro.md
    standard:
      complexity: [low, medium]
      required_sections: [Цель, Входные требования, Варианты и отклонённые, Решения, Декомпозиция, Зависимости, Критерии готовности, Риски]
      template: plan/standard.md
    full:
      complexity: [low, medium, high]
      required_sections: [Задача и связи, Цель, Входные требования, Варианты и отклонённые, Решения, Декомпозиция, Зависимости, Контракты, Критерии готовности, Открытые вопросы и одобрения, Риски]
      template: plan/full.md
  acceptance:
    profile: planning
    rules:
    - {kind: section_min_items, section: 'Варианты и отклонённые', min: 2}
    - {kind: section_present, section: 'Декомпозиция'}
