id: research-first
title: Исследование первым делом
type: planning
description: |
  Сначала исследование вариантов, затем план.
subtask_policy: optional
close_policy: all_subtasks_required
steps:
  - id: research
    name: Исследование вариантов
    action: desk_research
    output: plan.md с вариантами и trade-offs
    gate: findings_documented
  - id: plan
    name: Составление плана
    action: create_plan
    output: stage1/plan.md
    gate: constitution_check_passed
  - id: close
    name: Закрытие
    action: close_task
    output: approvals, stage_history
    gate: all_subtasks_closed
