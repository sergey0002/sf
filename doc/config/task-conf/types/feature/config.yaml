id: feature
title: Новая функциональность
description: |
  Разработка новой функциональности или расширение существующей. Требует плана,
  реализации, проверки и документирования изменений.
complexity_default: medium
complexity_allowed:
  - low
  - medium
  - high
  - critical
allowed_flows:
  - standard-implementation
  - research-first
default_flow: standard-implementation
subtask_policy: required
close_policy: all_subtasks_required
required_fields:
  - rollback_plan
  - acceptance_criteria
  - implementation_plan
forbidden_in_scope:
  - "data/ как проектный файл"
  - "task.md как альтернатива task.json"

selectable: true
plan:
  plan_policy: replace
  tiers:
    micro:
      complexity: [low]
      max_nonempty_lines: 60
      required_sections: [Изменение, Приёмка, Проверка]
      template: plan/micro.md
    standard:
      complexity: [low, medium]
      required_sections: [Цель и границы, Правила проекта, Решения, Артефакты и порядок, Оценка и декомпозиция, Риски и откат]
      template: plan/standard.md
    full:
      complexity: [low, medium, high, critical]
      required_sections: [Задача и связи, Цель и границы, Правила проекта, Решения, Артефакты и порядок, Риски, границы и откат, Оценка и декомпозиция, Открытые вопросы и одобрения]
      template: plan/full.md
  acceptance:
    profile: implementation
    rules:
    - {kind: case_min, min: 1}
    - {kind: case_min, min: 2, when: 'contract_or_storage'}
    - {kind: command, command: 'arch validate --brief'}
