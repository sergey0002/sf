id: research-first
title: Исследование первым делом
type: audit
description: |
  Поток для аудита: сбор фактов → анализ → отчёт с рекомендациями → закрытие.
subtask_policy: optional
close_policy: all_subtasks_required
steps:
  - id: audit
    name: Аудит
    action: desk_research
    output: plan.md с findings
    gate: findings_documented
  - id: report
    name: Отчёт
    action: decision_recommendation
    output: verification.json с отчётом
    gate: report_delivered
  - id: close
    name: Закрытие
    action: close_task
    output: approvals, stage_history
    gate: all_subtasks_closed
