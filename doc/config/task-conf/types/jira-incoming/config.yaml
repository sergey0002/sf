# Конфиг типа задачи: jira-incoming (вcoming задача из Jira)
# Источник практик: Корневой манифест, Контракт задачи для агента, Сквозной цикл разработки.

id: jira-incoming
title: Вcoming задача из Jira
description: |
  Задача, поступившая из внешнего трекера Jira. Имеет единственный flujo процесса,
  который регламентирует работу с такой задачей от приёма до закрытия.
complexity_default: medium
complexity_allowed:
  - low
  - medium
  - high
  - critical
allowed_flows:
  - jira-process
default_flow: jira-process
subtask_policy: required
close_policy: all_subtasks_required
required_fields:
  - rollback_plan
  - acceptance_criteria
  - implementation_plan
forbidden_in_scope:
  - "data/ как проектный файл"
  - "task.md как альтернатива task.json"
  - "автоматическое выделение task_number"
# Справочный шаблон. Текущий CLI читает flow, но не создаёт стадии из этого поля.
stage_template:
  - id: stage1
    name: Приём и уточнение
    artifacts: [task.json]
    gates: [task_validated]
  - id: stage2
    name: Планирование
    artifacts: [plan.md]
    gates: [plan_approved]
  - id: stage3
    name: Реализация
    artifacts: [changed_files, tests]
    gates: [tests_passed]
  - id: stage4
    name: Верификация
    artifacts: [verification.json, evidence]
    gates: [approval_obtained]

selectable: true
plan:
  plan_policy: replace
  tiers:
    micro:
      complexity: [low]
      max_nonempty_lines: 60
      required_sections: [Источник, Требование]
      template: plan/micro.md
    standard:
      complexity: [low, medium]
      required_sections: [Источник и маппинг, Требование, Границы, План, Приёмка, Синхронизация с трекером, Риски]
      template: plan/standard.md
    full:
      complexity: [low, medium, high, critical]
      required_sections: [Задача и связи, Источник и маппинг, Требование, Границы, План, Приёмка, Синхронизация с трекером, Полномочия записи, Риски]
      template: plan/full.md
  acceptance:
    profile: intake
    rules:
    - {kind: section_present, section: 'Источник и маппинг'}
    - {kind: case_min, min: 1}
