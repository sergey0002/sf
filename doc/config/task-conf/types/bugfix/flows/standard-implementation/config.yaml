id: standard-implementation
title: Стандартная реализация
type: bugfix
schema_version: flow-1
description: |
  Стандартный flujo исправления: воспроизведение → план → фикс → тест → верификация → закрытие.
subtask_policy: optional
close_policy: all_subtasks_required
initial_state: architecture-context
terminal_states:
  - close
states:
  - architecture-context
  - reproduce
  - plan
  - fix
  - review-implementation
  - architecture-sync
  - verify
  - close
transitions:
  - id: bug.context.ready
    from: architecture-context
    event: context.ready
    to: reproduce
  - id: bug.reproduced
    from: reproduce
    event: reproduction.recorded
    to: plan
  - id: bug.plan.ready
    from: plan
    event: plan.ready
    to: fix
  - id: bug.fix.applied
    from: fix
    event: fix.applied
    to: review-implementation
  - id: bug.review.passed
    from: review-implementation
    event: review.passed
    to: architecture-sync
  - id: bug.review.failed
    from: review-implementation
    event: review.failed
    to: fix
  - id: bug.architecture.synced
    from: architecture-sync
    event: architecture.synced
    to: verify
  - id: bug.recheck.failed
    from: verify
    event: checks.failed
    to: fix
  - id: bug.recheck.passed
    from: verify
    event: checks.passed
    to: close
steps:
  - id: architecture-context
    name: Сбор архитектурного контекста
    action: read_applicable_project_rules
    output: stageN/plan.md с источниками, инвариантами и связью с приёмкой
    gate: relevant_rules_traced_and_conflicts_resolved_for_targeted_work
  - id: reproduce
    name: Воспроизведение
    action: reproduce_bug
    output: evidence of bug
    gate: reproduction_or_accepted_alternative_recorded
  - id: plan
    name: Планирование
    action: create_plan
    output: stageN/plan.md
    gate: regression_oracle_and_required_approval_recorded
  - id: fix
    name: Исправление
    action: apply_fix
    output: changed files + regression test
    gate: fix_applied_and_test_added
  - id: review-implementation
    name: Ревью реализации
    action: review_diff_against_acceptance_on_stable_snapshot
    output: результат ревью и ссылки на доказательства в stageN/plan.md
    gate: blocking_review_findings_resolved
  - id: architecture-sync
    name: Синхронизация архитектурной документации
    action: record_verified_architecture_delta
    output: обновлены канонические записи или в плане указана причина отсутствия дельты
    gate: architecture_delta_matches_verified_behavior_or_no_delta_recorded
  - id: verify
    name: Верификация
    action: run_tests
    output: stageN/verification.json
    gate: mandatory_acceptance_cases_pass_on_evidence_snapshot
  - id: close
    name: Закрытие
    action: close_task
    output: approvals, stage_history
    gate: acceptance_subtasks_and_owner_approval_recorded
