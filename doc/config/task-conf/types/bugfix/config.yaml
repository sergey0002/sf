id: bugfix
title: Исправление ошибки
description: |
  Исправление дефекта. Требует воспроизведения, фикса, регресс-теста и верификации.
complexity_default: low
complexity_allowed:
  - low
  - medium
  - high
  - critical
allowed_flows:
  - standard-implementation
  - minimal-scaffold
default_flow: standard-implementation
subtask_policy: optional
close_policy: all_subtasks_required
required_fields:
  - current_behavior
  - evidence
  - acceptance_criteria
forbidden_in_scope:
  - "изменение API контрактов без отдельного одобрения"

selectable: true
plan:
  plan_policy: replace
  tiers:
    micro:
      complexity: [low]
      max_nonempty_lines: 60
      required_sections: [Воспроизведение, Изменение]
      template: plan/micro.md
    standard:
      complexity: [low, medium]
      required_sections: [Цель, Воспроизведение, Причина, Правила, Решение, Регрессия, Оценка, Риски]
      template: plan/standard.md
    full:
      complexity: [low, medium, high, critical]
      required_sections: [Задача и связи, Цель, Воспроизведение, Причина, Правила, Решение, Регрессия, Границы данных, Оценка, Риски]
      template: plan/full.md
  acceptance:
    profile: regression
    rules:
    - {kind: case_min, min: 2}
    - {kind: section_present, section: 'Воспроизведение'}
    - {kind: section_present, section: 'Регрессия'}
