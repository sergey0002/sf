id: docs-only
title: Только документация
type: docs
schema_version: flow-1
description: |
  Поток для задач, которые меняют только архитектурную документацию,
  скиллы, конфиги путей. Требует структурной валидации путей и frontmatter.
subtask_policy: optional
close_policy: all_subtasks_required
initial_state: architecture-context
terminal_states:
  - close
states:
  - architecture-context
  - change
  - validate
  - close
transitions:
  - id: docs.context.ready
    from: architecture-context
    event: context.ready
    to: change
  - id: docs.change.ready
    from: change
    event: change.ready
    to: validate
  - id: docs.validate.passed
    from: validate
    event: checks.passed
    to: close
  - id: docs.validate.failed
    from: validate
    event: checks.failed
    to: change
steps:
  - id: architecture-context
    name: Сбор архитектурного контекста
    action: read_applicable_project_rules
    output: stageN/plan.md с источниками, инвариантами и связью с приёмкой
    gate: relevant_rules_traced_and_conflicts_resolved_for_targeted_work
  - id: change
    name: Изменение документации
    action: bounded_markdown_diff
    output: документация или её конфигурация в согласованном scope
    gate: paths_declared_and_frontmatter_valid
  - id: validate
    name: Структурная валидация
    action: run_cli_validation
    output: stageN/verification.json
    gate: arch_validate_and_paths_check_passed
  - id: close
    name: Закрытие
    action: close_task
    output: approvals, stage_history
    gate: acceptance_subtasks_and_applicable_approvals_recorded
